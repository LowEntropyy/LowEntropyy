       <path class="gp-sweep" d="M26 74 h55.6 h14.6 q3 -1.7 6 0 l2 3 l4 -6.6 l4 14.6 l2 -11 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 3 l4 -9.9 l4 17.9 l2 -11 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 3 l4 -6.6 l4 14.6 l2 -11 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 3 l4 -9.3 l4 17.3 l2 -11 q3 -6.5 6 0 h14.6 h55.6 h17 q3 -1.7 6 0 l2 3 l4 -17.1 l4 25.1 l2 -11 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 3 l4 -10.4 l4 18.4 l2 -11 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 3 l4 -36 l4 44 l2 -11 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 3 l4 -29.3 l4 37.3 l2 -11 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 3 l4 -21 l4 29 l2 -11 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 3 l4 -22.1 l4 30.1 l2 -11 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 3 l4 -24.9 l4 32.9 l2 -11 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 3 l4 -19.9 l4 27.9 l2 -11 q3 -6.5 6 0 h17" pathLength="1000" fill="none"
             stroke="#C4452F" stroke-width="2.2" stroke-linecap="round"
             stroke-dasharray="140 860" filter="url(#gp-glow)"/>
  
  
  <text class="gp-heart" x="26" y="130" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace"
        font-size="16" fill="#C4452F">♥</text>
  <text x="46" y="130" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace"
        font-size="22" font-weight="700" fill="#2A2118">180<tspan
        font-size="10" font-weight="400" fill="#8A7B67" dx="4">bpm</tspan></text>
  <text x="150" y="128" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace"
           font-size="10.5" fill="#8A7B67">⚡ 8d streak  ·  SH+  ·  499 beats/yr</text>
  <text x="804" y="128" text-anchor="end"
        font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="10.5" fill="#C4452F"
        class="gp-dot">● beating now</text>
  
  
</svg>