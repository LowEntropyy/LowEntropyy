             stroke="#C4452F" stroke-width="4.4" stroke-linecap="round"
             stroke-dasharray="250 750" opacity="0.09" filter="url(#gp-glow)"/>
       <path class="gp-sweep" d="M210 128 h18 h6 q3 -1.7 6 0 l0.5 1.5 l8.5 -11.728 l8.5 15.228 l0.5 -5 q3 -6.5 6 0 h8.4 h8.4 q3 -1.7 6 0 l0.5 1.5 l8.5 -18 l8.5 21.5 l0.5 -5 q3 -6.5 6 0 h6 h6 q3 -1.7 6 0 l0.5 1.5 l8.5 -11.728 l8.5 15.228 l0.5 -5 q3 -6.5 6 0 h8.4 h8.4 q3 -1.7 6 0 l0.5 1.5 l8.5 -16.992 l8.5 20.492 l0.5 -5 q3 -6.5 6 0 h6 h18 h8.4 q3 -1.7 6 0 l0.5 1.5 l8.5 -31.44 l8.5 34.94 l0.5 -5 q3 -6.5 6 0 h6 h6 q3 -1.7 6 0 l0.5 1.5 l8.5 -19.008 l8.5 22.508 l0.5 -5 q3 -6.5 6 0 h8.4 h8.4 q3 -1.7 6 0 l0.5 1.5 l8.5 -66.72 l8.5 70.22 l0.5 -5 q3 -6.5 6 0 h6 h6 q3 -1.7 6 0 l0.5 1.5 l8.5 -54.288 l8.5 57.788 l0.5 -5 q3 -6.5 6 0 h8.4 h8.4 q3 -1.7 6 0 l0.5 1.5 l8.5 -38.72 l8.5 42.22 l0.5 -5 q3 -6.5 6 0 h6 h6 q3 -1.7 6 0 l0.5 1.5 l8.5 -40.848 l8.5 44.348 l0.5 -5 q3 -6.5 6 0 h8.4 h8.4 q3 -1.7 6 0 l0.5 1.5 l8.5 -46 l8.5 49.5 l0.5 -5 q3 -6.5 6 0 h6 h6 q3 -1.7 6 0 l0.5 1.5 l8.5 -56.304 l8.5 59.804 l0.5 -5 q3 -6.5 6 0 h8.4" transform="matrix(1.114627 0 0 1 -60.072 18)" vector-effect="non-scaling-stroke" pathLength="1000" fill="none"
             stroke="#C4452F" stroke-width="2.4" stroke-linecap="round"
             stroke-dasharray="92 908" filter="url(#gp-glow)"/>
  
  
  
  <text x="22" y="65" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="9.5"
           letter-spacing="1.4" fill="#8A7B67">HEART RATE</text>
       <text class="gp-heart" x="22" y="91" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace"
           font-size="18" fill="#C4452F">♥</text>
       <text x="44" y="91" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="24"
           font-weight="700" fill="#C4452F">180<tspan font-size="10"
           font-weight="400" fill="#8A7B67" dx="4">bpm</tspan></text>
       <text x="22" y="111" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="9.5"
           letter-spacing="1.4" fill="#8A7B67">MERGES / YR</text>
       <text x="22" y="137" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="24"
           font-weight="700" fill="#C4452F">69</text>
       <text x="22" y="157" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="9.5"
           letter-spacing="1.4" fill="#8A7B67">REVIEWS / YR</text>
       <text x="22" y="183" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="24"
           font-weight="700" fill="#A96A00">0</text>
       <text x="22" y="203" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="9.5"
           letter-spacing="1.4" fill="#8A7B67">STREAK · TYPE</text>
       <text x="22" y="229" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="24"
           font-weight="700" fill="#2A2118">8d<tspan
           fill="#8A7B67" font-size="16" dx="8">SH+</tspan></text>
  <text x="808" y="236" text-anchor="end"
        font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="10.5" fill="#C4452F"
