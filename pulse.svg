           letter-spacing="1.4" fill="#8A7B67">HEART RATE</text>
       <text x="22" y="246" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="24"
           font-weight="700" fill="#C4452F">180<tspan font-size="10"
           font-weight="400" fill="#8A7B67" dx="4">bpm</tspan></text>
       <text x="219" y="222" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="9.5"
           letter-spacing="1.4" fill="#8A7B67">MERGES / YR</text>
       <text x="219" y="246" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="24"
