<svg xmlns="http://www.w3.org/2000/svg" width="100%"
     viewBox="0 0 830 260" role="img" aria-labelledby="gp-title gp-desc">
  <title id="gp-title">LowEntropyy's pulse — 180 bpm (radiant)</title>
  <desc id="gp-desc">GitHub activity heartbeat for @LowEntropyy: 233 contributions this week, 513 in the last year.</desc>
  <style>.gp-trail{animation:gp-sweep 3s linear infinite}
       .gp-sweep{animation:gp-sweep 3s linear infinite}
       .gp-grid-pulse{animation:gp-grid-breathe 5.4s ease-in-out infinite}
       .gp-pill-pulse{animation:gp-pill-breathe 4.8s ease-in-out infinite}
       .gp-heart{animation:gp-thump 0.3s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
       .gp-dot{animation:gp-blink 1.8s ease-in-out infinite}
       @keyframes gp-sweep{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
       @keyframes gp-grid-breathe{0%,100%{opacity:.72}50%{opacity:.96}}
       @keyframes gp-pill-breathe{0%,100%{opacity:.72}50%{opacity:1}}
       @keyframes gp-thump{0%,100%{transform:scale(1)}15%{transform:scale(1.32)}30%{transform:scale(1)}}
       @keyframes gp-blink{50%{opacity:.25}}@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style>
  <defs>
    
    <filter id="gp-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gp-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="rgba(196,69,47,0.14)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="829" height="259"
        rx="12" fill="#F6EFE3" stroke="rgba(196,69,47,0.14)"/>
  <rect x="16" y="48" width="798" height="150" fill="url(#gp-grid)" opacity="0.9" class="gp-grid-pulse"/>

  <text x="26" y="32" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="13"
        font-weight="600" fill="#2A2118">LowEntropyy</text>

  <rect class="gp-pill-pulse" x="737.8" y="18" width="66.2" height="19"
        rx="9.5" fill="none" stroke="#C4452F" opacity="0.85"/>
  <text x="770.9" y="31" text-anchor="middle"
        font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="10" font-weight="600"
        fill="#C4452F" letter-spacing="1">RADIANT</text>
  
  <line x1="26" y1="126" x2="804" y2="126"
        stroke="rgba(196,69,47,0.14)" stroke-width="1" opacity="0.25"/>
  <path d="M26 126 h55.6 h14.6 q3 -1.7 6 0 l2 6 l4 -7 l4 29 l2 -28 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 6 l4 -13.3 l4 35.3 l2 -28 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 6 l4 -7 l4 29 l2 -28 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 6 l4 -12.2 l4 34.2 l2 -28 q3 -6.5 6 0 h14.6 h55.6 h17 q3 -1.7 6 0 l2 6 l4 -26.7 l4 48.7 l2 -28 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 6 l4 -14.3 l4 36.3 l2 -28 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 6 l4 -62 l4 84 l2 -28 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 6 l4 -49.6 l4 71.6 l2 -28 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 6 l4 -34 l4 56 l2 -28 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 6 l4 -36.1 l4 58.1 l2 -28 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 6 l4 -41.3 l4 63.3 l2 -28 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 6 l4 -46.4 l4 68.4 l2 -28 q3 -6.5 6 0 h17" fill="none" stroke="#C4452F" stroke-width="1.7" opacity="0.20"/>
       <path class="gp-trail" d="M26 126 h55.6 h14.6 q3 -1.7 6 0 l2 6 l4 -7 l4 29 l2 -28 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 6 l4 -13.3 l4 35.3 l2 -28 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 6 l4 -7 l4 29 l2 -28 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 6 l4 -12.2 l4 34.2 l2 -28 q3 -6.5 6 0 h14.6 h55.6 h17 q3 -1.7 6 0 l2 6 l4 -26.7 l4 48.7 l2 -28 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 6 l4 -14.3 l4 36.3 l2 -28 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 6 l4 -62 l4 84 l2 -28 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 6 l4 -49.6 l4 71.6 l2 -28 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 6 l4 -34 l4 56 l2 -28 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 6 l4 -36.1 l4 58.1 l2 -28 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 6 l4 -41.3 l4 63.3 l2 -28 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 6 l4 -46.4 l4 68.4 l2 -28 q3 -6.5 6 0 h17" pathLength="1000" fill="none"
             stroke="#C4452F" stroke-width="5.2" stroke-linecap="round"
             stroke-dasharray="250 750" opacity="0.11" filter="url(#gp-glow)"/>
       <path class="gp-sweep" d="M26 126 h55.6 h14.6 q3 -1.7 6 0 l2 6 l4 -7 l4 29 l2 -28 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 6 l4 -13.3 l4 35.3 l2 -28 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 6 l4 -7 l4 29 l2 -28 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 6 l4 -12.2 l4 34.2 l2 -28 q3 -6.5 6 0 h14.6 h55.6 h17 q3 -1.7 6 0 l2 6 l4 -26.7 l4 48.7 l2 -28 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 6 l4 -14.3 l4 36.3 l2 -28 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 6 l4 -62 l4 84 l2 -28 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 6 l4 -49.6 l4 71.6 l2 -28 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 6 l4 -34 l4 56 l2 -28 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 6 l4 -36.1 l4 58.1 l2 -28 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 6 l4 -41.3 l4 63.3 l2 -28 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 6 l4 -46.4 l4 68.4 l2 -28 q3 -6.5 6 0 h17" pathLength="1000" fill="none"
             stroke="#C4452F" stroke-width="2.6" stroke-linecap="round"
             stroke-dasharray="92 908" filter="url(#gp-glow)"/>
  
  
  
  <text x="26" y="214" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="9.5"
           letter-spacing="1.4" fill="#8A7B67">HEART RATE</text>
       <text class="gp-heart" x="26" y="240" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace"
           font-size="18" fill="#C4452F">♥</text>
       <text x="48" y="240" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="24"
           font-weight="700" fill="#C4452F">180<tspan font-size="10"
           font-weight="400" fill="#8A7B67" dx="4">bpm</tspan></text>
       <text x="190" y="214" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="9.5"
           letter-spacing="1.4" fill="#8A7B67">PRS / YR</text>
       <text x="190" y="240" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="24"
           font-weight="700" fill="#C4452F">69</text>
       <text x="326" y="214" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="9.5"
           letter-spacing="1.4" fill="#8A7B67">REVIEWS / YR</text>
       <text x="326" y="240" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="24"
           font-weight="700" fill="#A96A00">0</text>
       <text x="462" y="214" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="9.5"
           letter-spacing="1.4" fill="#8A7B67">STREAK · TYPE</text>
       <text x="462" y="240" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="24"
           font-weight="700" fill="#2A2118">8d<tspan
           fill="#8A7B67" font-size="16" dx="8">SH+</tspan></text>
  <text x="804" y="238" text-anchor="end"
        font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="10.5" fill="#C4452F"
        class="gp-dot">● beating now</text>
  
  
</svg>