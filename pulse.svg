       <path class="gp-trail" d="M26 132 h55.6 h14.6 q3 -1.7 6 0 l2 3 l4 -6.7 l4 14.7 l2 -11 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 3 l4 -11.2 l4 19.2 l2 -11 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 3 l4 -6.7 l4 14.7 l2 -11 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 3 l4 -10.4 l4 18.4 l2 -11 q3 -6.5 6 0 h14.6 h55.6 h17 q3 -1.7 6 0 l2 3 l4 -20.8 l4 28.8 l2 -11 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 3 l4 -11.9 l4 19.9 l2 -11 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 3 l4 -46 l4 54 l2 -11 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 3 l4 -37.1 l4 45.1 l2 -11 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 3 l4 -26 l4 34 l2 -11 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 3 l4 -27.5 l4 35.5 l2 -11 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 3 l4 -31.2 l4 39.2 l2 -11 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 3 l4 -34.1 l4 42.1 l2 -11 q3 -6.5 6 0 h17" pathLength="1000" fill="none"
             stroke="#C4452F" stroke-width="4.8" stroke-linecap="round"
             stroke-dasharray="240 760" opacity="0.10" filter="url(#gp-glow)"/>
       <path class="gp-sweep" d="M26 132 h55.6 h14.6 q3 -1.7 6 0 l2 3 l4 -6.7 l4 14.7 l2 -11 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 3 l4 -11.2 l4 19.2 l2 -11 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 3 l4 -6.7 l4 14.7 l2 -11 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 3 l4 -10.4 l4 18.4 l2 -11 q3 -6.5 6 0 h14.6 h55.6 h17 q3 -1.7 6 0 l2 3 l4 -20.8 l4 28.8 l2 -11 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 3 l4 -11.9 l4 19.9 l2 -11 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 3 l4 -46 l4 54 l2 -11 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 3 l4 -37.1 l4 45.1 l2 -11 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 3 l4 -26 l4 34 l2 -11 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 3 l4 -27.5 l4 35.5 l2 -11 q3 -6.5 6 0 h17 h17 q3 -1.7 6 0 l2 3 l4 -31.2 l4 39.2 l2 -11 q3 -6.5 6 0 h14.6 h14.6 q3 -1.7 6 0 l2 3 l4 -34.1 l4 42.1 l2 -11 q3 -6.5 6 0 h17" pathLength="1000" fill="none"
             stroke="#C4452F" stroke-width="2.4" stroke-linecap="round"
             stroke-dasharray="88 912" filter="url(#gp-glow)"/>
  
  
  <text class="gp-heart" x="26" y="238" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace"
        font-size="16" fill="#C4452F">♥</text>
  <text x="46" y="238" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace"
        font-size="22" font-weight="700" fill="#2A2118">180<tspan
        font-size="10" font-weight="400" fill="#8A7B67" dx="4">bpm</tspan></text>
  <text x="160" y="236" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace"
           font-size="11.5" fill="#8A7B67">⚡ 8d streak  ·  SH+  ·  512 beats/yr</text>
  <text x="804" y="236" text-anchor="end"
        font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="10.5" fill="#C4452F"
        class="gp-dot">● beating now</text>
  
  
</svg>