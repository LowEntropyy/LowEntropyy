name: Dynamic Profile Pulse

on:
  push:
    branches:
      - main
  schedule:
    - cron: "55 6 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "3 7 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "13 7 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "25 18 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "33 18 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "43 18 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "25 22 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "33 22 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "43 22 * * *"
      timezone: "Asia/Kuala_Lumpur"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dynamic-github-pulse
  cancel-in-progress: true

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Run central pulse renderer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_TOKEN: ${{ secrets.PROFILE_PULSE_TOKEN }}
          CALLER_REPO: ${{ github.repository }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MODE: user
          SUBJECT: LowEntropyy
          LABEL: LowEntropyy
          DAYS: "14"
        run: |
          rm -rf /tmp/pulse-control
          git clone --quiet --depth 1 --branch main https://github.com/LowEntropyy/LowEntropyy.git /tmp/pulse-control
          bash /tmp/pulse-control/scripts/render-pulse.sh
