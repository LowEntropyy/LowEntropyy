name: Dynamic Profile Pulse

on:
  push:
    branches:
      - main
  schedule:
    - cron: "55 6 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "3 7 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "13 7 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "25 18 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "33 18 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "43 18 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "25 22 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "33 22 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "43 22 * * *"
      timezone: "Asia/Kuala_Lumpur"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dynamic-github-pulse
  cancel-in-progress: true

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Run central pulse renderer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # User-scoped read:user token: data reads only; never used for publishing.
          DATA_TOKEN: ${{ secrets.PROFILE_PULSE_TOKEN }}
          CALLER_REPO: ${{ github.repository }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MODE: user
          SUBJECT: LowEntropyy
          LABEL: LowEntropyy
          DAYS: "14"
        run: |
          rm -rf /tmp/pulse-control
          git clone --quiet --depth 1 --branch main https://github.com/LowEntropyy/LowEntropyy.git /tmp/pulse-control

          # Keep the central renderer's theme/data/pagination behavior intact.
          # Inject the Profile-only geometry pass after SVG generation and before
          # the renderer publishes pulse-assets, so each refresh remains one commit.
          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/pulse-control/scripts/render-pulse.sh')
          target = Path('/tmp/render-profile-pulse.sh')
          text = source.read_text()
          needle = 'test -s /tmp/pulse.svg\n'
          if text.count(needle) != 1:
              raise SystemExit('expected one pulse SVG verification hook')
          text = text.replace(
              needle,
              needle + 'python3 /tmp/pulse-control/scripts/postprocess-profile-pulse.py /tmp/pulse.svg\n',
              1,
          )
          target.write_text(text)
          PY

          bash /tmp/render-profile-pulse.sh
