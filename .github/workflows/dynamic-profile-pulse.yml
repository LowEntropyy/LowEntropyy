name: Dynamic Profile Pulse

on:
  push:
    branches:
      - main
  schedule:
    - cron: "55 6 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "3 7 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "13 7 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "25 18 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "33 18 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "43 18 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "25 22 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "33 22 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "43 22 * * *"
      timezone: "Asia/Kuala_Lumpur"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: dynamic-github-pulse
  cancel-in-progress: true

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Verify profile data token
        shell: bash
        env:
          DATA_TOKEN: ${{ secrets.PROFILE_PULSE_TOKEN }}
          STATUS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "${DATA_TOKEN:-}" ]]; then
            desc="missing PROFILE_PULSE_TOKEN"
            state="failure"
          else
            curl -sS -D /tmp/headers -o /tmp/user.json \
              -H "Authorization: Bearer $DATA_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/user
            login="$(python -c 'import json; print(json.load(open("/tmp/user.json")).get("login", "unknown"))')"
            scopes="$(awk 'BEGIN{IGNORECASE=1} /^x-oauth-scopes:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' /tmp/headers)"
            cat >/tmp/graphql.json <<'JSON'
          {"query":"query { user(login: \"LowEntropyy\") { contributionsCollection { contributionCalendar { totalContributions } } } }"}
          JSON
            curl -sS -o /tmp/graphql-out.json \
              -H "Authorization: Bearer $DATA_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/graphql.json \
              https://api.github.com/graphql
            total="$(python -c 'import json; d=json.load(open("/tmp/graphql-out.json")); print((((d.get("data") or {}).get("user") or {}).get("contributionsCollection") or {}).get("contributionCalendar",{}).get("totalContributions","unknown"))')"
            desc="login=$login scopes=${scopes:-none} total=$total"
            state="success"
          fi
          python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({"state": os.environ["STATE"], "context": "profile-pulse-token", "description": os.environ["DESC"][:140]}))
          PY
        env:
          DATA_TOKEN: ${{ secrets.PROFILE_PULSE_TOKEN }}
          STATUS_TOKEN: ${{ github.token }}
          STATE: success
          DESC: token-check

      - name: Publish token diagnostic status
        if: always()
        shell: bash
        env:
          DATA_TOKEN: ${{ secrets.PROFILE_PULSE_TOKEN }}
          STATUS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "${DATA_TOKEN:-}" ]]; then
            state="failure"
            desc="missing PROFILE_PULSE_TOKEN"
          else
            curl -sS -D /tmp/headers -o /tmp/user.json -H "Authorization: Bearer $DATA_TOKEN" https://api.github.com/user
            login="$(python -c 'import json; print(json.load(open("/tmp/user.json")).get("login", "unknown"))')"
            scopes="$(awk 'BEGIN{IGNORECASE=1} /^x-oauth-scopes:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' /tmp/headers)"
            printf '%s' '{"query":"query { user(login: \"LowEntropyy\") { contributionsCollection { contributionCalendar { totalContributions } } } }"}' >/tmp/graphql.json
            curl -sS -o /tmp/graphql-out.json -H "Authorization: Bearer $DATA_TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/graphql.json https://api.github.com/graphql
            total="$(python -c 'import json; d=json.load(open("/tmp/graphql-out.json")); print((((d.get("data") or {}).get("user") or {}).get("contributionsCollection") or {}).get("contributionCalendar",{}).get("totalContributions","unknown"))')"
            state="success"
            desc="login=$login scopes=${scopes:-none} total=$total"
          fi
          payload="$(STATE="$state" DESC="$desc" python -c 'import json,os; print(json.dumps({"state":os.environ["STATE"],"context":"profile-pulse-token","description":os.environ["DESC"][:140]}))')"
          curl -sS -o /dev/null -X POST \
            -H "Authorization: Bearer $STATUS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

      - name: Run central pulse renderer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_TOKEN: ${{ secrets.PROFILE_PULSE_TOKEN }}
          CALLER_REPO: ${{ github.repository }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MODE: user
          SUBJECT: LowEntropyy
          LABEL: LowEntropyy
          DAYS: "14"
        run: |
          rm -rf /tmp/pulse-control
          git clone --quiet --depth 1 --branch main https://github.com/LowEntropyy/LowEntropyy.git /tmp/pulse-control
          bash /tmp/pulse-control/scripts/render-pulse.sh
